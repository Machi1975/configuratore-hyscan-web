  #rad-root .brandline{gap:var(--space-8);flex:1 1 auto}
  #rad-root .logo-slot{min-width:0;max-width:45%;height:24px;padding-inline:var(--space-5);overflow:hidden;text-overflow:ellipsis;justify-content:flex-start}
  #rad-root .top .badge{display:inline-flex;flex:0 1 auto;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:var(--space-5) var(--space-8);font-size:12px;letter-spacing:.04em}  /* v0.23.3: sulla sua riga il badge respira per intero (il 38% era della testata a una riga) */
  #rad-root .top .wrap{flex-wrap:wrap;justify-content:flex-start;min-height:0;padding-block:var(--space-5);row-gap:var(--space-2)}
  #rad-root .brandline{flex:1 1 100%}
  #rad-root .stage-open{width:var(--touch-min);height:var(--touch-min)}
  #rad-root .rail .wrap{padding-inline:0}
  #rad-root .rail ol{overflow-x:auto;gap:var(--space-8);padding-inline:var(--space-21);scroll-snap-type:x proximity;scroll-padding-inline:var(--space-21);scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #rad-root .rail ol::-webkit-scrollbar{display:none}
  #rad-root .rail li{flex:none;scroll-snap-align:center}
  #rad-root .rail-passi{padding-inline:var(--space-21);overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  #rad-root .rail-passi > *{flex:none;scroll-snap-align:center}  /* niente shrink: il nowrap sopra farebbe sovrapporre i testi */
  #rad-root .rail-passi::-webkit-scrollbar{display:none}
  #rad-root .tappa-cap,#rad-root .tappa-st{min-height:var(--touch-min);min-width:var(--touch-min);justify-content:center}
  /* v0.23.4 — review 21/1: il B3 vale per la TESTATA; il piè di pagina tiene il suo lockup a ogni misura */
  #rad-root .top .logo-b .lg,#rad-root[data-surface="dark"] .top .logo-b .lg{display:none}
  #rad-root .top .logo-b .sb--chiaro{display:block}
  #rad-root[data-surface="dark"] .top .logo-b .sb--chiaro{display:none}
  #rad-root[data-surface="dark"] .top .logo-b .sb--scuro{display:block}
  #rad-root .layout{gap:var(--space-13)}
  #rad-root .stage{display:grid;grid-template-columns:89px minmax(0,1fr) auto;gap:var(--space-13);align-items:center;margin:0;padding:var(--space-8);border:1px solid var(--border-ui);border-radius:var(--radius-8);background:var(--surface)}
  #rad-root .stage .scene-box{border-radius:var(--radius-5);border-style:solid}
  #rad-root .stage .scene-layer{gap:0;padding:var(--space-5)}
  #rad-root .stage .scene-layer .slot-name,#rad-root .stage .scene-layer .slot-meta{display:none}
  #rad-root .stage .scene-chip{width:21px;height:21px}
  #rad-root .stage .scene-cap{flex-direction:column;align-items:flex-start;gap:var(--space-2);padding-top:0;min-width:0;font-size:13px}
  #rad-root .stage .scene-cap span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #rad-root .stage .scene-cap span:empty::before{content:attr(data-vuoto);color:var(--text-secondary)}
  #rad-root .stage-open{display:inline-flex;min-height:var(--touch-min);min-width:var(--touch-min);padding-inline:var(--space-8);white-space:nowrap}
  #rad-root .bar .wrap{flex-wrap:nowrap;gap:var(--space-13);padding-block:var(--space-8)}
  #rad-root .tot{min-width:0}
  #rad-root .tot .label-13{display:block;letter-spacing:.02em;color:var(--text-secondary)}
  #rad-root .tot .val{font-size:18px;line-height:1.2}
  #rad-root .tot .note{display:none}
  #rad-root .actions{gap:var(--space-8);flex:none}
  #rad-root .actions .btn{padding:13px 16px}
  #rad-root [data-cfg="hint"]{bottom:calc(var(--space-13) + 72px)}
  #rad-root .profsum{min-height:var(--touch-min)}
  #rad-root .qtybtn,#rad-root .colbtn{width:var(--touch-min);height:var(--touch-min)}
  #rad-root .step-head{margin-bottom:var(--space-13)}
  #rad-root .opts{margin-block:var(--space-13)}
}
@media (max-width:639px){
  #rad-root .scelta{grid-template-columns:1fr}
  #rad-root .scelta .dx{justify-content:space-between}
  #rad-root .plancia-r{grid-template-columns:repeat(2,1fr)}
  #rad-root .contatti{padding:var(--space-13)}
  #rad-root[data-vista="riepilogo"] .actions [data-cfg="indietro"]{display:none}  /* sotto sm, nel riepilogo, si torna dai «Modifica» e dalla rotaia: la CTA resta intera */
}
#rad-root .scena-full{border:0;padding:0;margin:0;width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;background:var(--surface);color:var(--text-primary)}
#rad-root .scena-full::backdrop{background:rgba(0,0,0,.6)}
#rad-root .scena-full-in{display:grid;gap:var(--space-13);padding:var(--space-21);align-content:center;min-height:100%}
#rad-root .scena-x{position:fixed;top:var(--space-13);right:var(--space-21);z-index:2;width:var(--touch-min);height:var(--touch-min);display:inline-flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border-component);border-radius:var(--radius-pill);color:var(--text-secondary);cursor:pointer;transition:color var(--motion-fast),border-color var(--motion-fast)}
#rad-root .scena-x:hover{color:var(--text-primary);border-color:var(--structure)}

#rad-root .esito h3{margin:0 0 var(--space-8);font-family:var(--font-titles);font-size:16px}
#rad-root .esito p{margin:0 0 var(--space-13);color:var(--text-secondary);font-size:14px;line-height:1.55}
#rad-root .scena-full .scene-cap{padding-top:0}
#rad-root[data-surface="dark"] .scena-full{background:var(--surface-dark-1, var(--surface))}
#rad-root[data-surface="dark"] [data-cfg="hint"]{background:var(--surface-dark-2);border-color:var(--text-primary)}

/* v0.49.3 — rail mobile: dissolvenza ai bordi come affordance dello scorrimento
   (finding Machi 21/09 «non ci sta su una riga sola»); sotto i 640 i capitoli
   scendono a 12px così il cammino intero rientra sui telefoni comuni. */
@media (max-width:832px){
#rad-root .rail ol,#rad-root .rail-passi{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--space-21),#000 calc(100% - var(--space-21)),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 var(--space-21),#000 calc(100% - var(--space-21)),transparent 100%)}
}
@media (max-width:639px){
#rad-root .tappa-cap{font-size:12px}
}
.tema-btn{background:none;border:0;padding:0;margin-left:auto;display:inline-flex;align-items:center;justify-content:center;min-width:var(--touch-min);min-height:var(--touch-min);color:var(--text-secondary);cursor:pointer;border-radius:var(--radius-5);transition:color var(--motion-fast)}
.tema-btn:hover{color:var(--text-primary)}
.tema-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tema-btn .ic-sole{display:none}
#rad-root[data-surface="dark"] .tema-btn .ic-luna{display:none}
#rad-root[data-surface="dark"] .tema-btn .ic-sole{display:block}
.scene-cap .cap-fam { font-style: italic; color: var(--text-secondary); }
.scene-cap .cap-fam:empty { display: none; }
/* ── v0.44 · collaudo: spunta checkbox · toast leggibile · controllo evidente ── */
#rad-root .chk input:checked ~ .box svg{display:block}
#rad-root .hint[data-cfg="hint"]{font-size:15px;line-height:1.55;padding:var(--space-21);max-width:min(640px,calc(100vw - 32px));box-shadow:var(--elev-4)}
#rad-root .hint[data-cfg="hint"]:not(:empty){border-left:5px solid var(--ui-orange)}
#rad-root .hint[data-cfg="hint"][data-kind="ok"]:not(:empty){border-left-color:var(--sem-green)}
#rad-root .controllo{background:var(--surface-warm);border-radius:var(--radius-8);padding:var(--space-21)}
#rad-root .controllo .label-13{letter-spacing:.08em;text-transform:uppercase}
#rad-root .controllo.ha-note{border-color:var(--ui-orange);background:var(--surface-warm)}
@supports (background: color-mix(in srgb, red 7%, white)){#rad-root .controllo.ha-note{background:color-mix(in srgb, var(--ui-orange) 7%, var(--surface))}}
#rad-root[data-surface="dark"] .controllo{background:var(--surface)}
@supports (background: color-mix(in srgb, red 12%, black)){#rad-root[data-surface="dark"] .controllo.ha-note{background:color-mix(in srgb, var(--ui-orange) 12%, var(--surface))}}
/* ── v0.26.1 · SCENE REALI (innesto additivo) ── */
#rad-root .scene-layer .scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4%;box-sizing:border-box}
#rad-root .scene-layer.has-img .slot-name,#rad-root .scene-layer.has-img .slot-meta{display:none}
#rad-root .scene-layer.has-img .scene-chip{position:absolute;left:13px;top:13px;z-index:1}
#rad-root .stage .scene-layer.has-img{padding:0}
/* ── v0.45 · rimando «Vedi la voce»: lampeggio della card richiamata ── */
#rad-root .opt .card.evidenza{animation:rad-evid 1.8s ease}
@keyframes rad-evid{0%,55%{box-shadow:inset 0 0 0 3px var(--accent)}100%{box-shadow:none}}
/* ── v0.46 · LAYOUT DENSO sui viewport larghi: i passi stanno a schermo ──
   Card opzioni su due colonne (i blocchi strutturali a tutta riga),
   S.O.T.A. a tre colonne, spaziature compattate sui token Fibonacci. */
@media (min-width:1440px){
/* v0.47 — decisione Machi: COLONNA UNICA dopo la S.O.T.A. (le due colonne
   spezzavano l'ordine di lettura del listino); resta la compattezza. */
#rad-root .opts{gap:var(--space-8)}
#rad-root .opt .card{padding:var(--space-13)}
#rad-root .progrid{grid-template-columns:repeat(3,1fr)}
#rad-root .layout{gap:var(--space-21)}
#rad-root .opts{margin-block:var(--space-13)}
}
@media (min-width:1680px){
#rad-root .layout{grid-template-columns:1.8fr 1.2fr}
}
/* ── v0.47 · FISARMONICHE «CONTENUTE»: il padre è una testata, i figli le
   sole zone cliccabili. Aperto = pannello su fondo caldo con testata
   attenuata (maiuscoletto, tono secondario, separatore); lo stato «manca»
   (fondo giallo) resta con la sua livrea. Vale a TUTTE le larghezze. ── */
#rad-root details.fisa[open]:not(.manca),

#rad-root[data-surface="dark"] details.fisa[open]:not(.manca),
#rad-root[data-surface="dark"] details.fisa-sost[open]:not(.manca),
#rad-root[data-surface="dark"] details.fisa-fam[open]:not(.manca){background:var(--surface)}
#rad-root details.fisa[open]>summary,
#rad-root details.fisa-sost[open]>summary,
#rad-root details.fisa-fam[open]>summary{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);border-bottom:1px solid var(--border-ui)}
#rad-root details.fisa-sost[open]>summary .fs-nome,
#rad-root details.fisa-fam[open]>summary .fs-nome{font-weight:600}

    pb.setAttribute("aria-valuemin", "0"); pb.setAttribute("aria-valuemax", String(totQ)); pb.setAttribute("aria-valuenow", String(n));
    q("prog").style.width = ((n / totQ) * 100).toFixed(2) + "%";
  }

  /* ── riepilogo a due colonne (riga() dei riuniti) ── */
  function kDi(pid) { var k = 0; passi().forEach(function (p, j) { if (p.id === pid) { k = j; } }); return k; }
  function etPasso(pid) { var e = ""; passi().forEach(function (p) { if (p.id === pid) { e = p.et; } }); return e; }
  function renderRiepilogo() {
    var V = passi();
    q("riep-eyebrow").textContent = tpl(UI.passo_di, { n: V.length + 1, tot: V.length + 1 });
    q("riep-titolo").textContent = UI.riep_titolo;
    q("riep-lead").textContent = UI.riep_lead;
    q("riep-scelte-titolo").textContent = UI.riepilogo_scelte;
    q("form-titolo").textContent = UI.form_titolo;
    var ctr = q("controllo");
    ctr.hidden = false; ctr.classList.remove("ha-note");
    ctr.innerHTML = '<div class="label-13">' + UI.controllo_titolo + '</div><p class="ctr-ok"></p>';
    ctr.querySelector(".ctr-ok").textContent = UI.controllo_ok;
    var ul = q("scelte"); ul.innerHTML = "";
    function riga(etich, nome, codice, delta, k) {
      var li = document.createElement("li"); li.className = "scelta";
      li.innerHTML = '<span class="sin"><span class="label-13 muted"></span><span data-r-nome></span>' + (codice ? '<span class="mono muted"></span>' : "") + "</span>" +
        '<span class="dx"><span class="delta"></span><button type="button" class="tlink" data-k="' + k + '"></button></span>';
      li.querySelector(".label-13").textContent = etich;
      li.querySelector("[data-r-nome]").textContent = nome;
      if (codice) { li.querySelector(".mono").textContent = codice; }
      li.querySelector(".delta").textContent = delta;
      li.querySelector(".tlink").textContent = UI.modifica;
      ul.appendChild(li);
    }
    vociRiepilogo().forEach(function (v) {
      var pid = v.passo || "modello";
      var delta = v.tipo === "serie" ? UI.di_serie : (v.tipo === "modello" ? eur(v.prezzo) : "+ " + eur(v.prezzo));
      var det = v.tipo === "modello" ? " · modello di listino" : "";
      riga(etPasso(pid) + det, v.nome, v.cod, delta, kDi(pid));
    });
  }
  q("scelte").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".tlink") : null;
    if (b) { goTo(parseInt(b.getAttribute("data-k"), 10)); }
  });

  /* ── modulo recapiti (markup dei riuniti) ── */
  var ALERT = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
  var CAMPI = [{ id: "nome", label: UI.campo_nome, type: "text", ac: "given-name" }, { id: "cognome", label: UI.campo_cognome, type: "text", ac: "family-name" },
               { id: "email", label: UI.campo_email, type: "email", ac: "email" }, { id: "telefono", label: UI.campo_telefono, type: "tel", ac: "tel" }];
  var campiBox = q("campi");
  CAMPI.forEach(function (c) {
    var d = document.createElement("div"); d.className = "field";
    d.innerHTML = '<label for="rad-' + c.id + '">' + c.label + "</label>" +
      '<input type="' + c.type + '" id="rad-' + c.id + '" name="' + c.id + '" autocomplete="' + c.ac + '" aria-describedby="rad-msg-' + c.id + '">' +
      '<p class="msg" id="rad-msg-' + c.id + '" hidden>' + ALERT + "<span></span></p>";
    campiBox.appendChild(d);
  });
  var dC = document.createElement("div"); dC.className = "field";
  dC.innerHTML = '<label class="chk"><input type="checkbox" id="rad-consenso" aria-describedby="rad-msg-consenso">' +
    '<span class="box" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></span>' +
    "<span>" + UI.consenso + "</span></label>" + '<p class="msg" id="rad-msg-consenso" hidden>' + ALERT + "<span></span></p>";
  campiBox.appendChild(dC);
  function setErr(id, txt) {
    var f = R.querySelector("#rad-" + id), box = f.closest(".field"), msg = R.querySelector("#rad-msg-" + id);
    if (txt) { box.classList.add("err"); f.setAttribute("aria-invalid", "true"); msg.querySelector("span").textContent = txt; msg.hidden = false; }
    else { box.classList.remove("err"); f.removeAttribute("aria-invalid"); msg.hidden = true; }
  }
  campiBox.addEventListener("input", function (e) { if (e.target.id) { setErr(e.target.id.replace("rad-", ""), null); } });
  q("form").addEventListener("submit", function (e) { e.preventDefault(); });
  function validaForm() {
    var primo = null;
    CAMPI.forEach(function (c) {
      var v = R.querySelector("#rad-" + c.id).value.trim(), err = null;
      if (!v || ((c.id === "nome" || c.id === "cognome") && v.length < 2)) { err = UI.err_obbligatorio; }
      else if (c.id === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) { err = UI.err_email; }
      else if (c.id === "telefono" && v.replace(/\D/g, "").length < 6) { err = UI.err_telefono; }
      setErr(c.id, err); if (err && !primo) { primo = R.querySelector("#rad-" + c.id); }
    });
    var cons = R.querySelector("#rad-consenso");
    setErr("consenso", cons.checked ? null : UI.err_consenso);
    if (!cons.checked && !primo) { primo = cons; }
    return primo;
  }
  function leggi(id) { return R.querySelector("#rad-" + id).value.trim(); }

  /* ── invio: cascata dei riuniti + riscontro immediato + guardia anti-doppio ── */
  function invia() {
    if (inviando || inviato) { return; }
    var primo = validaForm(); if (primo) { primo.focus(); return; }
    if (!PRONTO) { avviso(UI.invio_anteprima, 9000); return; }
    var btn = q("avanti"), testo = btn.textContent;
    inviando = true; btn.disabled = true; btn.textContent = UI.invio_in_corso;
    var corpo = JSON.stringify(payload({ nome: leggi("nome"), cognome: leggi("cognome"), email: leggi("email"), telefono: leggi("telefono") }));
    var esito = function (ok) {
      inviando = false;
      if (ok) {
        inviato = true; btn.textContent = UI.inviato; avviso(UI.invio_ok, 14000, "ok");
        if (!R.querySelector('[data-cfg="esito-invio"]')) {
          var fin = document.createElement("section"); fin.className = "esito"; fin.setAttribute("data-cfg", "esito-invio");
          fin.innerHTML = "<h3>" + UI.esito_titolo + "</h3><p>" + UI.esito_testo + "</p>";
          var bN = document.createElement("button"); bN.type = "button"; bN.className = "btn btn--secondary"; bN.setAttribute("data-cfg", "nuova-config");
          bN.textContent = UI.esito_nuova; bN.addEventListener("click", function () { location.reload(); });
          fin.appendChild(bN);
          var col = q("controllo"); col.parentNode.insertBefore(fin, col);
          if (fin.scrollIntoView) { fin.scrollIntoView({ block: "start" }); }
        }
      } else { btn.disabled = false; btn.textContent = testo; avviso(UI.invio_ko, 14000); }
    };
    var buono = function (r) { return r && (r.ok || r.type === "opaque"); };
    fetch(WEBHOOK, { method: "POST", headers: { "Content-Type": "application/json" }, body: corpo })
      .then(function (r1) { if (buono(r1)) { esito(true); } else { throw new Error("HTTP"); } })
      .catch(function () {
        fetch(WEBHOOK, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: corpo })
          .then(function (r2) { if (buono(r2)) { esito(true); } else { throw new Error("HTTP"); } })
          .catch(function () {
            fetch(WEBHOOK, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body: corpo })
              .then(function () { esito(true); }).catch(function () { esito(false); });
          });
      });
  }

  /* ── navigazione, barra, tema (idiomi riuniti) ── */
  function mostra(dentro, fuori) { fuori.hidden = true; dentro.hidden = false; dentro.classList.add("pre"); void dentro.offsetWidth; dentro.classList.remove("pre"); }
  function aggiornaBar() {
    var V = passi(), p = V[K];
    R.setAttribute("data-vista", inRiep() ? "riepilogo" : "passo");
    q("indietro").disabled = (K === 0);
    q("avanti").textContent = inRiep() ? (inviato ? UI.inviato : UI.richiedi) : UI.avanti;
    q("avanti").disabled = inRiep() ? (inviato || inviando) :
      ((p.id === "famiglia" && !fam) || (p.id === "modello" && !mod));
    q("totale").textContent = pronto1() ? eur(totale()) : "—";
  }
  function goTo(k) {
    var V = passi(), prev = K;
    if (k < 0) { k = 0; } if (k > V.length) { k = V.length; }
    if (k === V.length && !(tuttiVisitati() && pronto1())) { return; }
    K = k;
    if (K < V.length) { visitati[V[K].id] = true; renderPasso(); mostra(q("vista-passo"), q("vista-riepilogo")); }
    else { renderRiepilogo(); mostra(q("vista-riepilogo"), q("vista-passo")); }
    aggiornaRail(); aggiornaBar();
    if (navAvviata && prev !== K) {
      var mc = document.getElementById("rad-contenuto"); if (mc) { mc.scrollTop = 0; }
      if (R.scrollIntoView) { R.scrollIntoView({ block: "start" }); }
      window.scrollTo(0, 0);
    }
    navAvviata = true;
  }
  function aggiorna() {   /* dopo una scelta: stesso passo, rotaia e barra ricalcolate */
    var V = passi(); if (K > V.length) { K = V.length; }
    renderPasso(); aggiornaRail(); aggiornaBar();
  }
  q("avanti").addEventListener("click", function () {
    if (this.disabled) { return; }
    if (inRiep()) { invia(); return; }
    var V = passi(); V.forEach(function (p, j) { if (j <= K) { visitati[p.id] = true; } });
    goTo(K + 1);
  });
  q("indietro").addEventListener("click", function () { if (K > 0) { goTo(K - 1); } });

  var tb = q("tema");
  try { if (new URLSearchParams(window.location.search).get("surface") === "dark") { R.setAttribute("data-surface", "dark"); } } catch (e0) {}
  function temaEti() { tb.setAttribute("aria-label", R.getAttribute("data-surface") === "dark" ? UI.tema_chiaro : UI.tema_scuro); }
  tb.addEventListener("click", function () { if (R.getAttribute("data-surface") === "dark") { R.removeAttribute("data-surface"); } else { R.setAttribute("data-surface", "dark"); } temaEti(); });
  temaEti();

  /* ── testi fissi della shell ── */
  q("skip").textContent = "Vada al contenuto";
  q("titolo-app").textContent = "Configuratore · Lastrine e telecamera";
  q("badge-demo").textContent = "Listino " + D.edizione;
  q("lbl-totale").textContent = UI.totale;
  q("nota-totale").textContent = UI.nota_totale;
  q("indietro").textContent = UI.indietro;
  q("firma").textContent = UI.firma;
  q("mdr-testo").textContent = UI.mdr;
  q("legale").textContent = UI.legale;
  q("figura-apri").setAttribute("aria-label", "Ingrandisci la scena");
  q("figura-apri").addEventListener("click", function () {
    var dl = q("scena-full"); if (!dl || !dl.showModal) { return; }
    q("capFL").textContent = scenaCap[0]; q("capFR").textContent = scenaCap[1]; riempi(q("lyF")); dl.showModal();
  });
  q("figura-chiudi").setAttribute("aria-label", "Chiudi");
  q("figura-chiudi").addEventListener("click", function () { q("scena-full").close(); });

  window.__RAD = { get famiglia() { return fam; }, get modello() { return mod; }, get variante() { return varInfo(); },
    get totale() { return totale(); }, get K() { return K; }, get passi() { return passi().map(function (p) { return p.id; }); },
    get payloadAnteprima() { return payload({ nome: "", cognome: "", email: "", telefono: "" }); },
    goTo: goTo, versioni: D.versioni };
  var topEl = R.querySelector(".top");   /* idioma riuniti: la barra alta misura la testata */
  function misuraTop() { if (topEl && topEl.offsetHeight) { R.style.setProperty("--nav-h", topEl.offsetHeight + "px"); } }
  misuraTop(); window.addEventListener("resize", misuraTop);
  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(misuraTop); }
  /* 1.0.1 · deep-link dalla scelta guidata: ?famiglia=<id> apre il passo «modello» con la famiglia scelta */
  var famQ = null;
  try { famQ = new URLSearchParams(window.location.search).get("famiglia"); } catch (e1) {}
  var famDL = null;
  D.famiglie.forEach(function (ff) { if (ff.id === famQ) { famDL = ff; } });
  if (famDL) {
    fam = famDL.id; visitati = { famiglia: true };
    goTo(1);
    avviso("Le ho già aperto la famiglia «" + famDL.nome + "»: se cerca un altro apparecchio, la cambia al passo 1.", 9000);
  } else {
    goTo(0);
  }
})();
</script>
